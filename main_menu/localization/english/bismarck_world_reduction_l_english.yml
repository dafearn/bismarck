l_english:
 bismarck_wr_level_keep: "Keep"
 bismarck_wr_level_keep_desc: "Nothing changes."
 bismarck_wr_level_remove_nations: "Remove Nations"
 bismarck_wr_level_remove_nations_desc: "All [countries|e] here lose their land at game start. Land, [pops|e] and trade goods stay, and the area can be colonized again."
 bismarck_wr_level_simplify: "Remove Nations, Simplify Pops"
 bismarck_wr_level_simplify_desc: "As Remove Nations, and every region's [pops|e] are converted to its largest [culture|e] and [religion|e] so they merge into fewer pops. Trade goods stay and the area can be colonized again. Best for performance while keeping trade goods."
 bismarck_wr_level_wipe: "Wipe"
 bismarck_wr_level_wipe_desc: "As Remove Nations, and each location is left as a near-empty rural settlement where [pops|e] can't grow, so colonizing it is pointless. Its trade goods are effectively gone for the whole campaign."
 bismarck_wr_player_note: "Land owned by a player or a player's [subject|e] is never touched."
 rule_bismarck_wr_japan: "Remove Japan"
 setting_bismarck_wr_japan_keep: "$bismarck_wr_level_keep$"
 setting_bismarck_wr_japan_keep_desc: "$bismarck_wr_level_keep_desc$"
 setting_bismarck_wr_japan_remove_nations: "$bismarck_wr_level_remove_nations$"
 setting_bismarck_wr_japan_remove_nations_desc: "$bismarck_wr_level_remove_nations_desc$ Japan has about 150 small countries at start, but few pops. Holds 13 of the world's 92 tea locations. $bismarck_wr_player_note$"
 setting_bismarck_wr_japan_simplify: "$bismarck_wr_level_simplify$"
 setting_bismarck_wr_japan_simplify_desc: "$bismarck_wr_level_simplify_desc$ Japan has about 150 small countries at start, but few pops. Holds 13 of the world's 92 tea locations. $bismarck_wr_player_note$"
